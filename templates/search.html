<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBMS Search Module | High-Dimensional Multimedia Retrieval</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Outfit', sans-serif; color: #fff; margin: 0; min-height: 100vh; padding-top: 40px; padding-bottom: 60px; }
        #particles-js { position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
        
        .glass-container { max-width: 900px; margin: auto; background: rgba(20, 25, 35, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); padding: 40px; position: relative; }
        
        .header-title { color: #00f2fe; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 0 0 10px rgba(0,242,254,0.3);}
        .form-label { font-weight: 600; color: #e0e0e0; margin-bottom: 8px;}
        
        /* Dark Inputs */
        .form-control { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; padding: 12px; }
        .form-control:focus { background: rgba(0,0,0,0.4); color: white; border-color: #00f2fe; box-shadow: 0 0 15px rgba(0,242,254,0.3); }
        .form-control::file-selector-button { background: #4facfe; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        
        /* Custom Radios */
        .radio-card { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 20px; cursor: pointer; transition: all 0.3s; color: #ccc; }
        .form-check-input:checked + .form-check-label .radio-card { border-color: #00f2fe; background: rgba(0,242,254,0.1); color: #00f2fe; box-shadow: 0 0 15px rgba(0,242,254,0.2); }
        
        /* Buttons */
        .btn-gradient { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: #000; border: none; padding: 14px; font-weight: 700; border-radius: 12px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;}
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,242,254,0.4); color: #000;}
        .btn-outline-glow { background: transparent; border: 2px solid #43e97b; color: #43e97b; padding: 12px; font-weight: 700; border-radius: 12px; transition: 0.3s; }
        .btn-outline-glow:hover { background: #43e97b; color: #000; box-shadow: 0 0 20px rgba(67, 233, 123, 0.4); }
        
        /* Results */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 25px; }
        .result-card { background: rgba(255,255,255,0.05); padding: 15px; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; text-align: center; transition: 0.3s; }
        .result-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: #00f2fe;}
        .result-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
        .result-card audio { width: 100%; height: 40px; margin-bottom: 12px; outline: none; border-radius: 10px;}
        .match-badge { background: rgba(0,242,254,0.2); color: #00f2fe; font-weight: 600; font-size: 0.8rem; padding: 6px 10px; border-radius: 8px; display: inline-block; margin-top: 8px; border: 1px solid rgba(0,242,254,0.3);}
        
        .back-btn { color: #aaa; text-decoration: none; font-weight: 500; transition: color 0.2s;}
        .back-btn:hover { color: #fff; }
        #loader { display: none; }
    </style>
</head>
<body>
<div id="particles-js"></div>

<div class="glass-container">
    <a href="/" class="back-btn mb-4 d-inline-block"><i class="bi bi-arrow-left"></i> Back to DBMS Dashboard</a>
    
    <h2 class="header-title mb-4"><i class="bi bi-radar"></i> DBMS Multimedia KNN Search</h2>
    <hr style="border-color: rgba(255,255,255,0.1);" class="mb-4">
    
    <form id="searchForm">
        <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <label class="form-label">1. Database Index</label>
                <div class="d-flex gap-3">
                    <div class="form-check p-0 w-100">
                        <input class="form-check-input d-none" type="radio" name="mediaType" id="img" value="image" checked>
                        <label class="form-check-label w-100" for="img">
                            <div class="radio-card text-center fw-bold"><i class="bi bi-image"></i> Images</div>
                        </label>
                    </div>
                    <div class="form-check p-0 w-100">
                        <input class="form-check-input d-none" type="radio" name="mediaType" id="aud" value="audio">
                        <label class="form-check-label w-100" for="aud">
                            <div class="radio-card text-center fw-bold"><i class="bi bi-soundwave"></i> Audio</div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label">2. Target Neighbors (K)</label>
                <input type="number" class="form-control fw-bold" name="kValue" min="1" max="50" value="5">
            </div>
        </div>

        <div class="mb-5">
            <label class="form-label">3. Upload Query Signature</label>
            <input type="file" class="form-control" name="queryFile" id="queryFile" required>
        </div>

        <div class="row g-3">
            <div class="col-md-8">
                <button type="submit" class="btn-gradient w-100"><i class="bi bi-lightning-charge-fill"></i> Execute Traversal</button>
            </div>
            <div class="col-md-4">
                <button type="button" id="vizButton" class="btn-outline-glow w-100"><i class="bi bi-map"></i> View Map</button>
            </div>
        </div>
    </form>

    <div id="loader" class="text-center mt-5">
        <div class="spinner-grow text-info" role="status"></div>
        <p class="mt-3 text-info fw-bold letter-spacing-1">TRAVERSING MBR BOUNDARIES...</p>
    </div>
    
    <div id="results" class="mt-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS('particles-js', {
        "particles": { "number": { "value": 50 }, "color": { "value": "#4facfe" }, "shape": { "type": "circle" }, "opacity": { "value": 0.5 }, "size": { "value": 2 }, "line_linked": { "enable": true, "distance": 150, "color": "#4facfe", "opacity": 0.2, "width": 1 }, "move": { "enable": true, "speed": 1 } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } } }, "retina_detect": true
    });

    let currentTopKIds = [];

    document.getElementById('searchForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        const formData = new FormData(e.target);
        const mediaType = document.querySelector('input[name="mediaType"]:checked').value;
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');
        
        loader.style.display = 'block';
        resultsDiv.innerHTML = '';
        currentTopKIds = [];

        try {
            const response = await fetch('/api/search', { method: 'POST', body: formData });
            if (!response.ok) throw new Error("Backend connection failed.");
            const data = await response.json();
            loader.style.display = 'none';

            if (data.error) {
                resultsDiv.innerHTML = `<div class="alert alert-danger bg-transparent border-danger text-danger"><i class="bi bi-exclamation-triangle"></i> ${data.error}</div>`;
                return;
            }

            resultsDiv.innerHTML = '<h4 class="mt-5 mb-3 fw-bold text-white">Retrieved Nearest Neighbors:</h4><div class="results-grid" id="gridContainer"></div>';
            const gridContainer = document.getElementById('gridContainer');

            data.results.forEach((match, index) => {
                currentTopKIds.push(match.point_id);
                let mediaTag = mediaType === 'image' 
                    ? `<img src="/images/${match.point_id}" alt="${match.point_id}" onerror="this.style.display='none'">` 
                    : `<audio controls controlsList="nodownload" class="w-100"><source src="/audio/${match.point_id}" type="audio/wav"></audio>`;

                gridContainer.innerHTML += `
                    <div class="result-card">
                        ${mediaTag}
                        <div class="text-start mt-2">
                            <span class="badge bg-light text-dark mb-2">Rank #${index + 1}</span><br>
                            <span class="text-truncate d-block small text-light font-monospace" title="${match.point_id}">${match.point_id}</span>
                            <div class="match-badge">Dist: ${match.distance.toFixed(4)}</div>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            loader.style.display = 'none';
            resultsDiv.innerHTML = `<div class="alert alert-danger bg-transparent border-danger text-danger"><i class="bi bi-plug"></i> Error: Python backend offline.</div>`;
        }
    });

    document.getElementById('vizButton').addEventListener('click', function() {
        const mediaType = document.querySelector('input[name="mediaType"]:checked').value;
        let url = `/visualize?type=${mediaType}`;
        if (currentTopKIds.length > 0) url += `&highlight=${currentTopKIds.join(',')}`;
        window.open(url, '_blank');
    });
</script>
</body>
</html>
