<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DBMS Visualizer Module | R-Tree Spatial Projection</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Outfit', sans-serif; color: #fff; margin: 0; min-height: 100vh; padding-top: 30px; padding-bottom: 30px; overflow-x: hidden;}
        #particles-js { position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
        
        .container-fluid-custom { max-width: 1500px; margin: auto; padding: 0 30px; position: relative;}
        
        .glass-panel { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden; }
        .sidebar-panel { background: rgba(0, 0, 0, 0.3); padding: 30px; border-right: 1px solid rgba(255,255,255,0.05); height: 100%;}
        
        .header-title { color: #38f9d7; font-weight: 700; text-shadow: 0 0 15px rgba(56, 249, 215, 0.4);}
        .form-select { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 10px; padding: 12px; }
        .form-select:focus { background: rgba(0,0,0,0.5); color: white; border-color: #38f9d7; box-shadow: 0 0 15px rgba(56, 249, 215, 0.3); }
        
        .btn-green-glow { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #000; border: none; padding: 14px; font-weight: 700; border-radius: 12px; transition: 0.3s; text-transform: uppercase;}
        .btn-green-glow:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(56, 249, 215, 0.4); color: #000;}
        
        .back-btn { color: #aaa; text-decoration: none; font-weight: 500; margin-bottom: 20px; display: inline-block; transition: 0.2s;}
        .back-btn:hover { color: #fff; }
        
        /* Iframe styling */
        .iframe-container { padding: 20px; display: flex; flex-direction: column; background: rgba(255,255,255,0.02);}
        #vizFrame { border-radius: 12px; background: #fff; } /* Keep iframe white for Plotly contrast */
    </style>
</head>
<body>
<div id="particles-js"></div>

<div class="container-fluid-custom">
    <a href="/" class="back-btn"><i class="bi bi-arrow-left"></i> Back to DBMS Dashboard</a>
    
    <div class="row g-0 glass-panel">
        <div class="col-lg-3 sidebar-panel">
            <h2 class="header-title mb-3"><i class="bi bi-layers"></i> R-Tree Index Visualizer</h2>
            <p class="text-light opacity-75 small mb-4">Live projection of high-dimensional MBRs reduced to 2D via Principal Component Analysis.</p>
            
            <hr style="border-color: rgba(255,255,255,0.1);" class="mb-4">
            
            <label class="form-label fw-bold text-white mb-2">Target Index Space</label>
            <select class="form-select mb-4 fw-bold" id="mediaType">
                <option value="image">CNN Image Vectors</option>
                <option value="audio">MFCC Audio Vectors</option>
            </select>
            
            <button class="btn-green-glow w-100" onclick="loadRealData()"><i class="bi bi-cpu-fill"></i> Render Geometry</button>
            
            <div id="loadingMsg" class="text-center text-info mt-4" style="display: none;">
                <div class="spinner-grow spinner-grow-sm mb-2" role="status" style="color: #38f9d7;"></div>
                <div class="small fw-bold letter-spacing-1" style="color: #38f9d7;">PROJECTING VECTORS...</div>
            </div>
        </div>
        
        <div class="col-lg-9 iframe-container">
            <iframe id="vizFrame" src="/visualize?type=image" style="width: 100%; height: 750px; border: none; opacity: 0.95;"></iframe>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS('particles-js', { "particles": { "number": { "value": 40 }, "color": { "value": "#38f9d7" }, "shape": { "type": "circle" }, "opacity": { "value": 0.5 }, "size": { "value": 3 }, "line_linked": { "enable": true, "distance": 150, "color": "#38f9d7", "opacity": 0.3, "width": 1 }, "move": { "enable": true, "speed": 1.5 } }, "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "grab" } } }});

    function loadRealData() {
        const mediaType = document.getElementById('mediaType').value;
        const iframe = document.getElementById('vizFrame');
        const loader = document.getElementById('loadingMsg');
        loader.style.display = 'block';
        iframe.style.opacity = '0.3';
        iframe.src = `/visualize?type=${mediaType}`;
        iframe.onload = function() { loader.style.display = 'none'; iframe.style.opacity = '0.95'; };
    }
</script>
</body>
</html>
